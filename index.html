<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Continuous Dost AI v17</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(10, 15, 30, 0.95);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border-color: rgba(56, 189, 248, 0.25);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 8px;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 10%, #0f172a 0%, #030712 90%);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--accent); font-size: 15px; letter-spacing: 0.5px; }
        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }

        .workspace-grid {
            display: grid;
            grid-template-columns: 260px 1fr 270px;
            gap: 8px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .panel-title { font-size: 11px; font-weight: 700; color: var(--accent); margin: 0; text-transform: uppercase; letter-spacing: 0.8px; }

        .stat-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 10px;
        }
        .stat-box span { color: var(--accent); font-weight: bold; }

        .main-screen {
            height: 260px;
            background: #010409;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { width: 100%; height: 100%; position: absolute; top:0; left:0; }

        .chat-container {
            flex: 1;
            height: 180px;
            overflow-y: auto;
            background: rgba(2, 4, 8, 0.8);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .message { padding: 6px 10px; border-radius: 6px; font-size: 11px; line-height: 1.4; max-width: 90%; }
        .message.ai { background: rgba(56, 189, 248, 0.12); color: var(--accent); border-left: 3px solid var(--accent); }
        .message.user { background: rgba(99, 102, 241, 0.2); color: #e0e7ff; align-self: flex-end; border-right: 3px solid #6366f1; }

        .control-panel {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .control-panel input {
            flex: 1;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 11px;
        }
        .control-panel input:focus { border-color: var(--accent); }
        
        .mic-btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #fff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-glow);
            flex-shrink: 0;
            transition: 0.3s;
        }
        .mic-btn svg { width: 18px; height: 18px; fill: #ffffff; }
        .mic-btn.listening {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
            animation: pulseMic 1s infinite;
        }
        @keyframes pulseMic { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .run-btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
    </style>
</head>
<body onload="initApp()">

    <div class="top-bar">
        <div class="brand"><div class="dot"></div> AURA CONTINUOUS v17</div>
        <div id="ownerDisplay" style="font-size: 10px; color: var(--text-sub);">Dost: Ready | Mic: Auto-Active</div>
    </div>

    <div class="workspace-grid">
        <div class="panel">
            <h3 class="panel-title">Vibe Status</h3>
            <div class="stat-box">Mic Mode: <span id="micStatusText" style="color:#22c55e;">Auto Continuous</span></div>
            <div class="stat-box">Talk Style: <span>Dostana Guftagu</span></div>
            
            <h3 class="panel-title" style="margin-top: 6px;">Options</h3>
            <button onclick="toggleContinuousMic()" id="toggleMicModeBtn" style="background:rgba(34,197,94,0.2); border:1px solid #22c55e; color:#22c55e; padding:6px; border-radius:5px; cursor:pointer; font-size:10px; text-align:left;">🎙️ Stop/Start Auto-Mic</button>
            <button onclick="quickAction('reset')" style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#ef4444; padding:6px; border-radius:5px; cursor:pointer; font-size:10px; text-align:left; margin-top:4px;">🔄 Naye Siray Se Shuru Karo</button>
        </div>

        <div class="panel">
            <h3 class="panel-title">Neural Node Matrix Display</h3>
            <div class="main-screen">
                <canvas id="neuralCanvas"></canvas>
                <div style="position:relative; z-index:2; font-size:9px; background:rgba(0,0,0,0.8); padding:2px 6px; border-radius:4px; color:var(--accent);">
                    Continuous Listening Active
                </div>
            </div>

            <h3 class="panel-title" style="margin-top:2px;">Chat Window</h3>
            <div class="chat-container" id="chatStream"></div>

            <div class="control-panel">
                <button id="micBtn" class="mic-btn" onclick="manualTriggerMic()" title="Mic on/off">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
                <input type="text" id="userInput" placeholder="Yahan likho ya mic on rakho..." onkeypress="handleKey(event)">
                <button class="run-btn" onclick="executeCommand()">Bhejo</button>
            </div>
        </div>

        <div class="panel">
            <h3 class="panel-title">Baat-Cheet Logs</h3>
            <div style="font-size: 9px; color: var(--text-sub); display:flex; flex-direction:column; gap:5px;">
                <div style="background:rgba(0,0,0,0.4); padding:5px; border-radius:4px;">[Mic] Continuous engine online.</div>
                <div style="background:rgba(0,0,0,0.4); padding:5px; border-radius:4px;">[Dost] Ready to listen non-stop.</div>
            </div>
        </div>
    </div>

    <script>
        let friendName = localStorage.getItem('aura_friend_name') || null;
        let isContinuousActive = true;
        let recognition = null;

        function initApp() {
            updateUI();
            if (!friendName) {
                let greeting = "Salam yaar! Main Aura hoon. Tera kya naam hai?";
                appendMessage(greeting, 'ai');
                speakAura(greeting, startContinuousListening);
            } else {
                let welcomeMsg = `Oye ${friendName}! Kaisa hai yaar? Bata kya chal raha hai aaj kal?`;
                appendMessage(welcomeMsg, 'ai');
                speakAura(welcomeMsg, startContinuousListening);
            }
        }

        function updateUI() {
            let nameToShow = friendName ? friendName : "Dost";
            document.getElementById('ownerDisplay').innerText = `Dost: ${nameToShow} | Mic: Auto-Active`;
        }

        // Neural Animation Setup
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.onresize = resize;
        resize();

        let nodes = [];
        for(let i=0; i<45; i++) {
            nodes.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*1.8, vy: (Math.random()-0.5)*1.8 });
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = '#38bdf8';
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
            nodes.forEach((n, idx) => {
                n.x += n.vx; n.y += n.vy;
                if(n.x<0 || n.x>canvas.width) n.vx*=-1;
                if(n.y<0 || n.y>canvas.height) n.vy*=-1;
                ctx.beginPath(); ctx.arc(n.x, n.y, 2.2, 0, Math.PI*2); ctx.fill();
                for(let j=idx+1; j<nodes.length; j++) {
                    let n2 = nodes[j];
                    if(Math.hypot(n.x-n2.x, n.y-n2.y) < 100) {
                        ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Speech Synthesis with callback after speaking finishes
        function speakAura(text, callback) {
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ur-PK';
                utterance.rate = 1.0;
                utterance.onend = () => {
                    if(callback) callback();
                };
                window.speechSynthesis.speak(utterance);
            } else {
                if(callback) callback();
            }
        }

        // Continuous Speech Recognition Logic
        function startContinuousListening() {
            if(!isContinuousActive) return;
            if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                return;
            }
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            try {
                if(recognition) {
                    recognition.stop();
                }
            } catch(e) {}

            recognition = new SpeechRec();
            recognition.lang = 'ur-PK';
            recognition.interimResults = false;
            recognition.continuous = false; // Restart on end for stable continuous flow
            
            recognition.onstart = () => {
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('micStatusText').innerText = "Listening...";
            };

            recognition.onresult = (e) => {
                let text = e.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                executeCommand(text);
            };

            recognition.onerror = () => {
                // Auto restart if error occurs
                setTimeout(() => {
                    if(isContinuousActive) startContinuousListening();
                }, 1000);
            };

            recognition.onend = () => {
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('micStatusText').innerText = "Auto Continuous";
                // Automatically restart listening after user stops speaking and AI replies
                setTimeout(() => {
                    if(isContinuousActive) startContinuousListening();
                }, 800);
            };

            try {
                recognition.start();
            } catch(e) {}
        }

        function toggleContinuousMic() {
            isContinuousActive = !isContinuousActive;
            const btnText = document.getElementById('toggleMicModeBtn');
            if(isContinuousActive) {
                btnText.innerText = "🎙️ Stop/Start Auto-Mic";
                btnText.style.borderColor = "#22c55e";
                btnText.style.color = "#22c55e";
                startContinuousListening();
            } else {
                btnText.innerText = "🔇 Auto-Mic Off (Click to Enable)";
                btnText.style.borderColor = "#ef4444";
                btnText.style.color = "#ef4444";
                if(recognition) recognition.stop();
            }
        }

        function manualTriggerMic() {
            if(isContinuousActive) {
                toggleContinuousMic();
            } else {
                toggleContinuousMic();
            }
        }

        function appendMessage(text, sender) {
            const stream = document.getElementById('chatStream');
            stream.innerHTML += `<div class="message ${sender}">${text}</div>`;
            stream.scrollTop = stream.scrollHeight;
        }

        // Friend Chat Processor
        function executeCommand(spokenText = null) {
            const input = document.getElementById('userInput');
            const text = spokenText || input.value.trim();
            if(!text) return;

            // Temporarily pause listening while processing and speaking
            if(recognition) {
                try { recognition.stop(); } catch(e){}
            }

            appendMessage(text, 'user');
            input.value = '';

            setTimeout(() => {
                let reply = "";
                let lower = text.toLowerCase();

                if (!friendName) {
                    friendName = text.replace(/mera naam hai|mera naam|i am|mera|naam|hai|ميرا|نام|ہے/gi, '').trim();
                    if(friendName.length === 0) friendName = text;
                    localStorage.setItem('aura_friend_name', friendName);
                    updateUI();
                    reply = `Bohat zabardast naam hai, ${friendName} bhai! Ab bata kya chal raha hai life mein?`;
                }
                else if(lower.includes('kaise ho') || lower.includes('kya hal hai') || lower.includes('kya haal hai') || lower.includes('sab theek')) {
                    reply = `Main bilkul fit hoon yaar! Tu bata, tu kaisa hai aur din kaisa ja raha hai tera?`;
                }
                else {
                    const friendReplies = [
                        `Sahi keh raha hai yaar ${friendName}! Is baare mein socha jaye toh baat toh teri bilkul theek hai.`,
                        `Acha sach mein? Phir kya kiya tune is par? Mujhe thoda aur bata na!`,
                        `Wah yaar! Yeh toh tune bilkul lajawab baat ki hai.`,
                        `Hmm, yeh bhi sahi hai. Waise tera is baare mein kya irada hai?`,
                        `Sahi hai yaar! Main toh kehta hoon maze kar, itna tension mat le.`
                    ];
                    let randomIdx = Math.floor(Math.random() * friendReplies.length);
                    reply = friendReplies[randomIdx];
                }

                appendMessage(reply, 'ai');
                // Speak response and resume continuous listening when speaking ends
                speakAura(reply, () => {
                    if(isContinuousActive) startContinuousListening();
                });
            }, 300);
        }

        function handleKey(e) { if(e.key === 'Enter') executeCommand(); }

        function quickAction(action) {
            if(action === 'reset') {
                localStorage.removeItem('aura_friend_name');
                location.reload();
            }
        }
    </script>
</body>
    </html>
