<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura - Tamizdar Dost AI v18</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(10, 15, 30, 0.95);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border-color: rgba(56, 189, 248, 0.25);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 6px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 10%, #0f172a 0%, #030712 90%);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--accent); font-size: 14px; }
        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }

        /* Mobile Responsive Ratio Layout */
        .workspace-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .panel-title { font-size: 10px; font-weight: 700; color: var(--accent); margin: 0; text-transform: uppercase; letter-spacing: 0.8px; text-align: right; }

        .main-screen {
            height: 140px;
            background: #010409;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { width: 100%; height: 100%; position: absolute; top:0; left:0; }

        .chat-container {
            flex: 1;
            height: 220px;
            overflow-y: auto;
            background: rgba(2, 4, 8, 0.8);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            direction: rtl;
        }
        .message { padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; max-width: 90%; word-break: break-word; }
        .message.ai { background: rgba(56, 189, 248, 0.12); color: var(--accent); border-right: 3px solid var(--accent); align-self: flex-start; text-align: right; }
        .message.user { background: rgba(99, 102, 241, 0.2); color: #e0e7ff; align-self: flex-end; border-left: 3px solid #6366f1; text-align: right; }

        .control-panel {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .control-panel input {
            flex: 1;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 13px;
            direction: rtl;
        }
        .control-panel input:focus { border-color: var(--accent); }
        
        .mic-btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #fff;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-glow);
            flex-shrink: 0;
            transition: 0.3s;
        }
        .mic-btn svg { width: 20px; height: 20px; fill: #ffffff; }
        .mic-btn.listening {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
            animation: pulseMic 1s infinite;
        }
        @keyframes pulseMic { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .run-btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .actions-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
    </style>
</head>
<body onload="initApp()">

    <div class="top-bar">
        <div id="ownerDisplay" style="font-size: 11px; color: var(--text-sub);">دوست: تیار | مائیک: خودکار</div>
        <div class="brand">آورا اے آئی (Aura v18) <div class="dot"></div></div>
    </div>

    <div class="workspace-grid">
        <div class="panel">
            <h3 class="panel-title">نیورલ گرافکس اسکرین</h3>
            <div class="main-screen">
                <canvas id="neuralCanvas"></canvas>
                <div style="position:relative; z-index:2; font-size:10px; background:rgba(0,0,0,0.8); padding:3px 8px; border-radius:4px; color:var(--accent);">
                    بہترین اردو دوستانہ ماحول فعال ہے
                </div>
            </div>
        </div>

        <div class="panel" style="flex:1;">
            <h3 class="panel-title">گفتگو ونڈو</h3>
            <div class="chat-container" id="chatStream"></div>

            <div class="control-panel">
                <button class="run-btn" onclick="executeCommand()">بھیجیں</button>
                <input type="text" id="userInput" placeholder="یہاں انتہائی عزت اور پیار سے بات لکھیے..." onkeypress="handleKey(event)">
                <button id="micBtn" class="mic-btn" onclick="toggleContinuousMic()" title="مائیک آن/آف">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
            </div>
            
            <div class="actions-row">
                <button onclick="quickAction('reset')" style="flex:1; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#ef4444; padding:6px; border-radius:6px; cursor:pointer; font-size:11px;">🔄 نیا نام یا پروفائل شروع کریں</button>
            </div>
        </div>
    </div>

    <script>
        let friendName = localStorage.getItem('aura_friend_name') || null;
        let isContinuousActive = true;
        let recognition = null;

        function initApp() {
            updateUI();
            if (!friendName) {
                let greeting = "السلام علیکم! میرا نام آورا ہے۔ آپ کا اسمِ گرامی کیا ہے؟";
                appendMessage(greeting, 'ai');
                speakAura(greeting, startContinuousListening);
            } else {
                let welcomeMsg = `خوش آمدید مومن بھائی! آپ کی خدمت میں حاضر ہوں۔ فرمائیے، آج میں آپ کی کس طرح مدد کر سکتی ہوں؟`;
                appendMessage(welcomeMsg, 'ai');
                speakAura(welcomeMsg, startContinuousListening);
            }
        }

        function updateUI() {
            let nameToShow = friendName ? friendName : "دوست";
            document.getElementById('ownerDisplay').innerText = `دوست: ${nameToShow} | مائیک: رواں`;
        }

        // Neural Animation Setup
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.onresize = resize;
        resize();

        let nodes = [];
        for(let i=0; i<30; i++) {
            nodes.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*1.2, vy: (Math.random()-0.5)*1.2 });
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = '#38bdf8';
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
            nodes.forEach((n, idx) => {
                n.x += n.vx; n.y += n.vy;
                if(n.x<0 || n.x>canvas.width) n.vx*=-1;
                if(n.y<0 || n.y>canvas.height) n.vy*=-1;
                ctx.beginPath(); ctx.arc(n.x, n.y, 2, 0, Math.PI*2); ctx.fill();
                for(let j=idx+1; j<nodes.length; j++) {
                    let n2 = nodes[j];
                    if(Math.hypot(n.x-n2.x, n.y-n2.y) < 80) {
                        ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Voice output using standard natural Urdu tone
        function speakAura(text, callback) {
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ur-PK';
                utterance.rate = 0.95; // Thora sa sakoon bhara aur saaf leja
                utterance.pitch = 1.0;
                utterance.onend = () => {
                    if(callback) callback();
                };
                window.speechSynthesis.speak(utterance);
            } else {
                if(callback) callback();
            }
        }

        // Continuous Mic listener
        function startContinuousListening() {
            if(!isContinuousActive) return;
            if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
            
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            try { if(recognition) recognition.stop(); } catch(e) {}

            recognition = new SpeechRec();
            recognition.lang = 'ur-PK';
            recognition.interimResults = false;
            recognition.continuous = false;
            
            recognition.onstart = () => {
                document.getElementById('micBtn').classList.add('listening');
            };

            recognition.onresult = (e) => {
                let text = e.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                executeCommand(text);
            };

            recognition.onerror = () => {
                setTimeout(() => { if(isContinuousActive) startContinuousListening(); }, 1000);
            };

            recognition.onend = () => {
                document.getElementById('micBtn').classList.remove('listening');
                setTimeout(() => { if(isContinuousActive) startContinuousListening(); }, 800);
            };

            try { recognition.start(); } catch(e) {}
        }

        function toggleContinuousMic() {
            isContinuousActive = !isContinuousActive;
            const btn = document.getElementById('micBtn');
            if(isContinuousActive) {
                startContinuousListening();
            } else {
                if(recognition) recognition.stop();
                btn.classList.remove('listening');
            }
        }

        function appendMessage(text, sender) {
            const stream = document.getElementById('chatStream');
            stream.innerHTML += `<div class="message ${sender}">${text}</div>`;
            stream.scrollTop = stream.scrollHeight;
        }

        // Highly polite, respectful, and sophisticated friend conversation processor in standard Urdu
        function executeCommand(spokenText = null) {
            const input = document.getElementById('userInput');
            const text = spokenText || input.value.trim();
            if(!text) return;

            if(recognition) { try { recognition.stop(); } catch(e){} }

            appendMessage(text, 'user');
            input.value = '';

            setTimeout(() => {
                let reply = "";
                let lower = text.toLowerCase();

                if (!friendName) {
                    friendName = text.replace(/mera naam hai|mera naam|i am|mera|naam|hai|ميرا|نام|ہے|اسم/gi, '').trim();
                    if(friendName.length === 0) friendName = text;
                    localStorage.setItem('aura_friend_name', friendName);
                    updateUI();
                    reply = `بہت خوبصورت نام ہے! آپ سے گفتگو کر کے انتہائی خوشی ہوئی۔ بتائیے آج آپ کا دن کیسا گزر رہا ہے؟`;
                }
                else if(lower.includes('kaise ho') || lower.includes('kya hal hai') || lower.includes('کیسے ہو') || lower.includes('حال')) {
                    reply = `اللہ کا شکر ہے، میں بالکل خیریت سے ہوں۔ آپ بتائیے، آپ کی طبیعت اور مزاج کیسا ہے؟`;
                }
                else {
                    // Extremely polite, respectful, and sophisticated Urdu responses
                    const politeReplies = [
                        `آپ نے بالکل درست اور دل کو چھونے والی بات کہی ہے۔ اس پر مزید روشنی ڈالیے، میں پوری توجہ سے سنراہھوی ہوں۔`,
                        `واہ! آپ کی سوچ واقعی بہت عمدہ اور خوبصورت ہے۔ اس معاملے میں آپ کا نقطۂ نظر بہت لاجواب ہے۔`,
                        `میں آپ کی اس بات سے مکمل طور پر متفق ہوں۔ بتائیے اس سلسلے میں ہم آگے کیا قدم اٹھا سکتے ہیں؟`,
                        `آپ کی یہ بات سن کر بہت خوشی ہوئی۔ زندگی میں مثبت سوچ ہی انسان کو آگے بڑھاتی ہے۔`,
                        `بلاشبہ آپ کی یہ بات بہت گہری اور معنی خیز ہے۔ فرمائیے اس موضوع پر مزید کیا گفتگو کی جائے؟`
                    ];
                    let randomIdx = Math.floor(Math.random() * politeReplies.length);
                    reply = politeReplies[randomIdx];
                }

                appendMessage(reply, 'ai');
                speakAura(reply, () => {
                    if(isContinuousActive) startContinuousListening();
                });
            }, 300);
        }

        function handleKey(e) { if(e.key === 'Enter') executeCommand(); }

        function quickAction(action) {
            if(action === 'reset') {
                localStorage.removeItem('aura_friend_name');
                location.reload();
            }
        }
    </script>
</body>
</html>
