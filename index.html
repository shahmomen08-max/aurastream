<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraCore Neural OS - Advanced AI Workspace</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #030712 80%);
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .core-orb {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: pulseOrb 2s infinite alternate;
        }
        @keyframes pulseOrb {
            0% { transform: scale(0.95); box-shadow: 0 0 10px rgba(56,189,248,0.3); }
            100% { transform: scale(1.08); box-shadow: 0 0 25px rgba(99,102,241,0.7); }
        }
        .brand-name { font-size: 16px; font-weight: 800; letter-spacing: 1px; color: #38bdf8; }
        
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 90px;
        }
        @media(min-width: 768px) {
            .main-layout { grid-template-columns: 340px 1fr; }
        }
        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* Neural Node Visualizer Canvas */
        .node-canvas-box {
            height: 180px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { width: 100%; height: 100%; position: absolute; top:0; left:0; }

        .mic-btn-box {
            text-align: center;
            margin-top: 15px;
        }
        .mic-btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #fff; border: none;
            padding: 12px 24px; border-radius: 30px;
            font-weight: bold; font-size: 14px; cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            display: inline-flex; align-items: center; gap: 8px;
            transition: 0.3s;
        }
        .mic-btn.listening {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            animation: pulseMic 1.2s infinite;
        }
        @keyframes pulseMic {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Chat Stream */
        .chat-stream {
            height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 12px;
        }
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; line-height: 1.4; }
        .msg.ai { background: rgba(56, 189, 248, 0.1); color: #38bdf8; align-self: flex-start; border-left: 3px solid #38bdf8; }
        .msg.user { background: rgba(99, 102, 241, 0.15); color: #e0e7ff; align-self: flex-end; border-right: 3px solid #6366f1; }

        .input-group { display: flex; gap: 8px; }
        .input-group input {
            flex: 1; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px; border-radius: 10px; color: #fff; outline: none; font-size: 14px;
        }
        .input-group input:focus { border-color: #38bdf8; }
        .input-group button {
            background: #38bdf8; color: #030712; border: none;
            padding: 0 16px; border-radius: 10px; font-weight: bold; cursor: pointer;
        }

        .metrics-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px;
        }
        .metric-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 12px; border-radius: 10px; text-align: center;
        }
        .metric-card h5 { margin: 0; color: #9ca3af; font-size: 11px; }
        .metric-card p { margin: 5px 0 0 0; color: #38bdf8; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="core-orb"></div>
            <div class="brand-name">AURACORE NEURAL OS</div>
        </div>
        <div id="netStatus" style="font-size: 11px; background: rgba(74,222,128,0.15); color: #4ade80; padding: 4px 10px; border-radius: 15px; border: 1px solid rgba(74,222,128,0.3);">
            ● Core Active
        </div>
    </header>

    <div class="main-layout">
        <!-- LEFT PANEL: NEURAL VISUALIZER & VOICE CONTROL -->
        <div class="panel">
            <h3 style="margin-top:0; font-size:15px; color:#fff;">Neural Node Matrix</h3>
            <div class="node-canvas-box">
                <canvas id="neuralCanvas"></canvas>
                <div style="position:relative; z-index:2; font-size:11px; color:#38bdf8; background:rgba(3,7,18,0.8); padding:4px 8px; border-radius:6px;">
                    AI Engine Active
                </div>
            </div>

            <div class="mic-btn-box">
                <button id="micBtn" class="mic-btn" onclick="toggleVoiceRecognition()">
                    🎤 Start Voice Command
                </button>
            </div>
            <p id="voiceStatus" style="text-align:center; font-size:11px; color:var(--text-sub); margin-top:10px;">
                Click button & speak to interact with Aura.
            </p>

            <div class="metrics-grid">
                <div class="metric-card">
                    <h5>CPU Load</h5>
                    <p>1.4%</p>
                </div>
                <div class="metric-card">
                    <h5>Active Nodes</h5>
                    <p>1,024</p>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: COMMAND STREAM & EXECUTION -->
        <div class="panel">
            <h3 style="margin-top:0; font-size:15px; color:#fff;">Command & Execution Terminal</h3>
            
            <div class="chat-stream" id="chatStream">
                <div class="msg ai">AuraCore Neural OS initialized successfully. Voice systems online. How can I assist your workflow, Momen?</div>
            </div>

            <div class="input-group">
                <input type="text" id="userInput" placeholder="Type a command or instruction..." onkeypress="handleKey(event)">
                <button onclick="processCommand()">Execute</button>
            </div>
        </div>
    </div>

    <script>
        // Neural Node Animation on Canvas
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.onresize = resizeCanvas;
        resizeCanvas();

        let particles = [];
        for(let i=0; i<25; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 1,
                vy: (Math.random() - 0.5) * 1
            });
        }

        function drawNeural() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = '#38bdf8';
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
            
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                ctx.fill();

                for(let j = index + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if(dist < 70) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawNeural);
        }
        drawNeural();

        // Speech Synthesis (AI Speaking)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Speech Recognition (Listening to User)
        let recognition;
        let isListening = false;

        function toggleVoiceRecognition() {
            const micBtn = document.getElementById('micBtn');
            const voiceStatus = document.getElementById('voiceStatus');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Aapka browser voice recognition support nahi karta. Chrome browser use karein!");
                return;
            }

            if (isListening) {
                if(recognition) recognition.stop();
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = "🛑 Listening...";
                voiceStatus.innerText = "Aura is listening to your command...";
            };

            recognition.onresult = (event) => {
                let speechResult = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechResult;
                processCommand(speechResult);
            };

            recognition.onerror = (event) => {
                voiceStatus.innerText = "Error occurred in recognition: " + event.error;
                stopMicState();
            };

            recognition.onend = () => {
                stopMicState();
            };

            recognition.start();
        }

        function stopMicState() {
            isListening = false;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 Start Voice Command";
            document.getElementById('voiceStatus').innerText = "Click button & speak to interact with Aura.";
        }

        // Process Commands
        function processCommand(voiceText = null) {
            const input = document.getElementById('userInput');
            const stream = document.getElementById('chatStream');
            const text = voiceText || input.value.trim();
            if(!text) return;

            stream.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            stream.scrollTop = stream.scrollHeight;

            setTimeout(() => {
                let reply = "Task executed successfully across neural nodes.";
                let lower = text.toLowerCase();

                if(lower.includes('hello') || lower.includes('hi')) {
                    reply = "Hello Momen! All systems are operating smoothly.";
                } else if(lower.includes('status') || lower.includes('system')) {
                    reply = "System status: 1024 active nodes running at peak efficiency.";
                } else if(lower.includes('caption') || lower.includes('anime')) {
                    reply = "Animeverse Caption Module loaded: Ready to generate viral tags.";
                } else {
                    reply = "Command '" + text + "' processed by neural core.";
                }

                stream.innerHTML += `<div class="msg ai">${reply}</div>`;
                stream.scrollTop = stream.scrollHeight;
                speakText(reply);
            }, 500);
        }

        function handleKey(e) {
            if(e.key === 'Enter') processCommand();
        }
    </script>
</body>
</html>
